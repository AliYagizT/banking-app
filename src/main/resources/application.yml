spring:
  application:
    name: banking-app

  # Read secrets (e.g. the datasource password under key `spring.datasource.password`)
  # from HashiCorp Vault when present. `optional:` means the app still boots (falling
  # back to the env defaults below) if Vault is unavailable, and tests without Vault are
  # unaffected.
  config:
    import: optional:vault://secret/banking

  cloud:
    vault:
      uri: ${VAULT_URI:http://127.0.0.1:8200}
      authentication: TOKEN
      token: ${VAULT_TOKEN:}
      fail-fast: false
      kv:
        enabled: true
        backend: secret
        default-context: banking

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banking}
    username: ${DB_USERNAME:banking}
    password: ${DB_PASSWORD:banking}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates that entities match it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

banking:
  optimistic-lock:
    # Bounded retries when a concurrent transaction wins the @Version race on an
    # account. Tune higher for hot single-account contention; see MoneyMovementService.
    max-retries: 20
    backoff-base-millis: 10
  credit:
    # Underwriting decision-support thresholds shown to the banker (advisory, not
    # auto-enforced). Turkish banks cap the monthly installment at half of declared
    # income; private-sector applicants typically need >=3 months at their current job.
    max-installment-to-income: 0.50
    min-employment-months: 3
  firebase:
    # Firebase Admin SDK: verifies Bearer ID tokens and (optionally) provisions staff
    # accounts. Disable in environments without Firebase (e.g. tests use a fake verifier).
    enabled: ${FIREBASE_ENABLED:true}
    # Path to the service-account JSON. Secret — never committed. Falls back to the ambient
    # GOOGLE_APPLICATION_CREDENTIALS if left blank.
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    project-id: ${FIREBASE_PROJECT_ID:banking-softtech}
    # One-off: create Firebase accounts for DB staff (BANKER/ADMIN) that lack one. Turn on
    # once (with the password below), then turn back off.
    seed-staff: ${FIREBASE_SEED_STAFF:false}
    staff-password: ${FIREBASE_STAFF_PASSWORD:banker123}
  security:
    login:
      # (Legacy) brute-force thresholds; unused since auth moved to Firebase tokens.
      max-attempts: 5
      block-minutes: 15
    cors:
      # Comma-separated browser origins allowed to call the API. Deny-by-default in
      # production: override CORS_ALLOWED_ORIGINS with your real web origin(s). The
      # localhost defaults below let the bundled `frontend/` dev server connect out of
      # the box (no client embeds any secret; auth is per-user).
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

server:
  port: 8080

logging:
  level:
    org.flywaydb: info
