<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Softtech Bank</title>
  <style>
    :root {
      --bg: #f4f6fb; --panel: #ffffff; --ink: #1a2233; --muted: #6b7686;
      --line: #e3e8f0; --brand: #3457d5; --brand-ink: #fff;
      --ok: #1a8f4c; --bad: #d13b3b; --warn: #b6892b;
      --shadow: 0 1px 3px rgba(20,30,60,.08), 0 6px 20px rgba(20,30,60,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1420; --panel: #182234; --ink: #e7ecf5; --muted: #93a0b5;
        --line: #26324a; --brand: #5b7cf0; --brand-ink: #0b1220;
        --ok: #46c37b; --bad: #f0736e; --warn: #e0b25a;
        --shadow: 0 1px 3px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    h2 { margin: 0 0 16px; } h3 { margin: 18px 0 10px; }
    a { color: var(--brand); cursor: pointer; text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { background: var(--line); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    .muted { color: var(--muted); }

    /* layout */
    .app { max-width: 1080px; margin: 0 auto; padding: 0 20px 60px; }
    .topbar { display: flex; align-items: center; gap: 20px; padding: 14px 0; flex-wrap: wrap;
      border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
    .brand { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .logo { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px;
      background: var(--brand); color: var(--brand-ink); font-weight: 800; }
    .tabs { display: flex; gap: 4px; margin-right: auto; }
    .tab { border: 0; background: transparent; color: var(--muted); padding: 8px 14px; border-radius: 8px;
      cursor: pointer; font-size: 14px; font-weight: 600; }
    .tab.active { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
    .user { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .email { color: var(--muted); }
    .role { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; background: var(--line); }
    .role-banker { background: #dfe8ff; color: #2447c0; } .role-admin { background: #ffe3e3; color: #b23; }
    @media (prefers-color-scheme: dark) { .role-banker { background:#22315e; color:#a9c0ff; } .role-admin{ background:#5a2530; color:#f6b3b0; } }
    .content { padding-top: 24px; }
    .subtabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
    .subtab { border: 0; background: transparent; color: var(--muted); padding: 8px 14px; cursor: pointer;
      font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .subtab.active { color: var(--brand); border-bottom-color: var(--brand); }

    /* cards & grids */
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 720px) { .two-col { grid-template-columns: 1fr; } }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .row { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }

    /* accounts */
    .acct { cursor: pointer; transition: transform .08s ease; }
    .acct:hover { transform: translateY(-2px); }
    .acct-no { font-family: ui-monospace, monospace; color: var(--muted); font-size: 13px; }
    .acct-bal { font-size: 26px; font-weight: 700; margin: 6px 0; }
    .acct-bal.big { font-size: 34px; }
    .cur { font-size: 14px; color: var(--muted); font-weight: 600; }
    .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
    .pill-active { background: #dff5e6; color: var(--ok); } .pill-frozen { background: #fff1d6; color: var(--warn); }
    .pill-closed { background: #ffe0e0; color: var(--bad); }
    .pill-submitted { background: #e3ecff; color: #2a4fc0; } .pill-approved { background:#dff5e6; color:var(--ok);} .pill-rejected{ background:#ffe0e0; color:var(--bad);}
    @media (prefers-color-scheme: dark){ .pill-active,.pill-approved{background:#1c3d2b;} .pill-frozen{background:#3d3320;} .pill-closed,.pill-rejected{background:#43222420;} .pill-submitted{background:#22315e;} }

    /* forms & buttons */
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 12px; color: var(--muted); }
    input, select { width: 100%; margin-top: 5px; padding: 9px 11px; border: 1px solid var(--line);
      border-radius: 9px; background: var(--bg); color: var(--ink); font-size: 14px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; }
    @media (max-width: 620px) { .form-grid { grid-template-columns: 1fr; } }
    .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 9px 16px;
      border-radius: 9px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .btn:hover { border-color: var(--brand); }
    .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
    .btn.success { background: var(--ok); color: #fff; border-color: var(--ok); }
    .btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
    .btn.small { padding: 5px 12px; font-size: 13px; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

    /* tables */
    .tbl { width: 100%; border-collapse: collapse; background: var(--panel);
      border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .tbl th, .tbl td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); font-size: 14px; }
    .tbl th { background: var(--bg); color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
    .tbl tr:last-child td { border-bottom: 0; }
    .tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
    .credit { color: var(--ok); font-weight: 600; } .debit { color: var(--bad); font-weight: 600; }

    /* auth */
    .auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .auth-card { width: 100%; max-width: 380px; }
    .auth-card .brand { justify-content: center; font-size: 22px; margin-bottom: 4px; }
    .auth-card p.muted { text-align: center; margin-top: 0; }
    .switch { text-align: center; margin-top: 14px; font-size: 14px; color: var(--muted); }
    .hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 18px; }

    /* credit / banker */
    .credit-form .btn { margin-top: 10px; }
    .plan-summary, .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
    .metrics { grid-template-columns: repeat(2, 1fr); }
    .plan-summary div, .metrics div { background: var(--bg); border-radius: 10px; padding: 10px 12px; }
    .plan-summary span, .metrics span { display: block; font-size: 12px; color: var(--muted); }
    .plan-summary strong, .metrics strong { font-size: 18px; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; }
    .kv dt { color: var(--muted); font-size: 13px; } .kv dd { margin: 0; font-weight: 600; }
    .crit { padding: 6px 0; font-weight: 600; } .crit.ok { color: var(--ok); } .crit.bad { color: var(--bad); }
    .verdict { margin-top: 12px; padding: 10px; border-radius: 10px; text-align: center; font-weight: 700; }
    .verdict.ok { background: #dff5e6; color: var(--ok); } .verdict.bad { background: #ffe6e6; color: var(--bad); }
    @media (prefers-color-scheme: dark){ .verdict.ok{background:#1c3d2b;} .verdict.bad{background:#43222420;} }
    .decision .actions { margin-top: 8px; }
    .back { display: inline-block; margin-bottom: 14px; }

    /* modal */
    .overlay { position: fixed; inset: 0; background: rgba(10,15,25,.5); display: grid; place-items: center; padding: 20px; z-index: 20; }
    .modal { background: var(--panel); border-radius: 14px; width: 100%; max-width: 440px; box-shadow: var(--shadow); }
    .modal.wide { max-width: 760px; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .modal-head h3 { margin: 0; }
    .modal-body { padding: 18px; max-height: 70vh; overflow: auto; }
    .x { border: 0; background: transparent; font-size: 24px; line-height: 1; cursor: pointer; color: var(--muted); }

    /* misc */
    .loading { padding: 60px; text-align: center; color: var(--muted); }
    .toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 40; }
    .toast { padding: 12px 16px; border-radius: 10px; color: #fff; box-shadow: var(--shadow); font-weight: 600; max-width: 320px; }
    .toast-info { background: #3a4658; } .toast-success { background: var(--ok); } .toast-error { background: var(--bad); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
